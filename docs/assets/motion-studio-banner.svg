      <rect x="331" y="363" width="130" height="44" rx="22" fill="#3a3025" stroke="#8c6c4c"/><text x="359" y="391">Position</text>
    </g>
    <text x="64" y="472" fill="#9cafaa" font-size="15">LOCAL BROWSER UI   ·   LIVE GRAPHS   ·   USB / TTL / RS485</text>
    <text x="1225" y="65" fill="#d3f48b" font-size="14" letter-spacing="2">PD42S1</text>
