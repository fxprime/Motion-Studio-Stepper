<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title description">
  <title id="title">ModuleMore Motion Studio — PD42S1</title>
  <desc id="description">Motion you can see. Control you can try. Velocity, torque and position in a local browser interface. Decorative rotor illustration, not measured test data.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#101719"/><stop offset="1" stop-color="#1c302b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#c4ec8a" stop-opacity=".13"/><stop offset="1" stop-color="#c4ec8a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#6c978b" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1440" height="520" rx="28" fill="url(#surface)"/>
  <rect width="1440" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1130" cy="257" r="270" fill="url(#glow)"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="64" y="64" fill="#eef4e9" font-size="25" font-weight="700">ModuleMore <tspan fill="#94a8a1" font-size="15" font-weight="400"> / MOTION STUDIO</tspan></text>
    <text x="64" y="121" fill="#d3f48b" font-size="13" letter-spacing="3">PD42S1 · PRODUCT SHOWCASE</text>
    <text x="60" y="206" fill="#f0f4ec" font-size="64" font-weight="700" letter-spacing="-2">Motion you can see.</text>
    <text x="60" y="280" fill="#d3f48b" font-size="64" font-weight="700" letter-spacing="-2">Control you can try.</text>
    <text x="64" y="328" fill="#adc0b9" font-size="20">Connect. Set a target. Watch the response.</text>
